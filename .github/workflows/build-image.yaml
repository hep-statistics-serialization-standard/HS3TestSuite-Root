name: Build image
on:
  workflow_dispatch:
    inputs:
      root_tag:
        description: ROOT release tag of registry.cern.ch/hs3-root/root-release (e.g. v6-40-04)
        required: true
      image_tag:
        description: Image tag to push (defaults to root_tag)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMG: ghcr.io/hep-statistics-serialization-standard/hs3testsuite-roofit:${{ inputs.image_tag || inputs.root_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: roofit.Dockerfile
          platforms: linux/amd64
          build-args: ROOT_TAG=${{ inputs.root_tag }}
          tags: ${{ env.IMG }}
          load: true
      - name: Smoke test
        run: |
          docker run --rm "$IMG" sh -c 'command -v generate-fixtures && python3 -c "import ROOT; from hs3suite_backend import HS3TestSuiteBackend; print(ROOT.gROOT.GetVersion())"'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          docker push "$IMG"
          echo "Pushed \`$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG")\`" >> "$GITHUB_STEP_SUMMARY"
